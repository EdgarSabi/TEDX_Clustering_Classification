name: Run TEDx updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  run-updater:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check secret availability
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then echo "DOCKER_USERNAME is missing"; else echo "DOCKER_USERNAME exists"; fi
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then echo "DOCKER_PASSWORD is missing"; else echo "DOCKER_PASSWORD exists"; fi
          if [ -z "${{ secrets.DOCKER_IMAGE }}" ]; then echo "DOCKER_IMAGE is missing"; else echo "DOCKER_IMAGE exists"; fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Docker image
        run: docker pull ${{ secrets.DOCKER_IMAGE }}

      - name: Run updater container
        run: |
          docker run --rm \
            -e DB_NAME="${{ secrets.DB_NAME }}" \
            -e DB_HOST="${{ secrets.DB_HOST }}" \
            -e DB_PORT="${{ secrets.DB_PORT }}" \
            -e DB_USER="${{ secrets.DB_USER }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            -e DB_SSLMODE="require" \
            -e API_KEY="${{ secrets.API_KEY }}" \
            ${{ secrets.DOCKER_IMAGE }}
